<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        var x=parseInt(prompt("Ingrese un número"));
        if(x%2==0){
            document.write("<h1>El número ingresado es par</h1>");

        }
        else{

            document.write("<h1>El número ingresado es impar</h1>");
        }

    </script>
</body>
